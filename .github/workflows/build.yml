name: Zephyr build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zephyr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out firmware repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: app
          persist-credentials: false

      - name: Set up Zephyr v4.4.0
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a # v1.0.15
        with:
          app-path: app
          toolchains: riscv64-zephyr-elf

      - name: Build native_sim
        run: west build -b native_sim -d app/build/native_sim app

      - name: Build ESP32-C6-DevKitC
        run: west build -b esp32c6_devkitc -d app/build/esp32c6_devkitc app
